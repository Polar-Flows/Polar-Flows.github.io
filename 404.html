<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Polar Flows</title>
    <meta name="description" content="The page you're looking for doesn't exist. Redirecting to Polar Flows homepage.">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/img/polarflows/Polarflows-logo-favicon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/polarflows/Polarflows-logo-favicon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/img/polarflows/Polarflows-logo-favicon.png">
    <link rel="apple-touch-icon" href="assets/img/polarflows/Polarflows-logo-favicon.png">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="assets/css/tokens.css?v=1.0.1">
    <link rel="stylesheet" href="assets/css/main.css?v=1.0.1">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #ffffff;
            color: #333333;
        }
        
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            background-color: #ffffff;
        }
        
        .error-content {
            max-width: 600px;
        }
        
        .error-code {
            font-size: 6rem;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 1rem;
            line-height: 1;
        }
        
        .error-title {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #1f2937;
        }
        
        .error-message {
            font-size: 1.1rem;
            color: #6b7280;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        
        .redirect-message {
            font-size: 0.9rem;
            color: #6b7280;
            margin-bottom: 2rem;
        }
        
        .countdown {
            font-weight: bold;
            color: #2563eb;
        }
        
        .btn-home {
            display: inline-block;
            padding: 1rem 2rem;
            background-color: #2563eb;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-home:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-content">
            <div class="error-code">404</div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-message">
                The page you're looking for doesn't exist or has been moved.
            </p>
            <p class="redirect-message">
                Redirecting to our homepage in <span class="countdown" id="countdown">5</span> seconds...
            </p>
            <a href="/" class="btn-home">Go to Homepage</a>
        </div>
    </div>

    <script>
        // Countdown and redirect functionality
        let countdown = 5;
        const countdownElement = document.getElementById('countdown');
        
        const timer = setInterval(() => {
            countdown--;
            countdownElement.textContent = countdown;
            
            if (countdown <= 0) {
                clearInterval(timer);
                window.location.href = '/';
            }
        }, 1000);
        
        // Immediate redirect if user clicks anywhere
        document.addEventListener('click', () => {
            clearInterval(timer);
            window.location.href = '/';
        });
        
        // Immediate redirect on keypress
        document.addEventListener('keydown', () => {
            clearInterval(timer);
            window.location.href = '/';
        });
    </script>
</body>
</html>
