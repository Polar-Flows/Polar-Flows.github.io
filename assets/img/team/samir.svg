<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <style>
      .avatar-bg { fill: #187ef9; }
      .avatar-text { fill: #ffffff; font-family: Arial, sans-serif; font-weight: bold; }
    </style>
  </defs>
  <!-- Background circle -->
  <circle cx="64" cy="64" r="64" class="avatar-bg"/>
  <!-- Letter S -->
  <text x="64" y="80" class="avatar-text" font-size="48" text-anchor="middle">S</text>
</svg>
